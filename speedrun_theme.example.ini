# Speedrun timer theme (the timer is on with RECOMP_SPEEDRUN=1; F11 shows/hides it).
#
# To use: copy this file to speedrun_theme.ini in the same folder (beside run_native.cmd), then edit it.
# Changes show within a second, even with the game running. Delete the file to get the default look back.
# A line starting with # is a note. Settings you leave out (or get wrong) keep the default shown here.
# Share your look: send someone your speedrun_theme.ini.

[timer]

# A heading above the time, e.g. your category. Empty = no title line. Quotes keep spaces and # signs.
title = ""

# Any font installed on your PC (as named in Windows' font list).
font = Consolas

# Size in percent of the default (50 to 300).
size = 100

# The big time in bold: yes / no.
bold = yes

# Colors: #RRGGBB or r, g, b.
color_running = #78E678    # the time while it counts
color_stopped = #B4B4B4    # the time while ready, loading or paused
color_text    = #EBEBEB    # the split line and the real-time line
color_title   = #EBEBEB    # the title line
color_box     = #0C0C10    # the box behind the text

# The box behind the text: yes, or no for the text alone over the game.
box = yes

# How solid the whole timer is, in percent (10 to 100).
opacity = 84

# Where it sits on the picture: top-right, top-left, bottom-right, bottom-left.
corner = top-right

# Which small lines show under the time: the split ("#3 Annex") and the real (wall-clock) time.
show_split = yes
show_real_time = yes

[splits]
# Your own names for the areas, shown on the split line. Left side: the area's folder name (the whole area)
# or the folder name with its part letter (one part, e.g. hon_under_B). Areas you do not name show the game's
# own name, e.g. "7F / Main Research Center".
#
# hon_under   = Floor 7
# hon_under_B = Floor 7, east wing
# bettou      = Annex
# hon_hon     = Main Hospital
# gesui       = Sewers
# kyodo       = Utility Tunnel
